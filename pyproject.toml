[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-reconciler"
version = "1.0.0"
description = "Reconciles Drupal registrations against Eventbrite sales; front-desk check-in and swag"
requires-python = ">=3.11"
dependencies = [
  "eventkit-core[app] @ https://github.com/pu-shd/eventkit/archive/refs/tags/v0.3.0.tar.gz",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-cov>=5.0", "respx>=0.21", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
ticket_reconciler = "ticket_reconciler.cli:main"

[tool.hatch.metadata]
# The eventkit dependency is a pinned GitHub tarball, which hatchling treats as a
# direct reference and refuses by default.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_reconciler"]
artifacts = ["src/ticket_reconciler/static/**"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; placeholder tokens are fixtures; xml parsing
# here is of output this repository just produced, not untrusted input.
"tests/**" = ["S101", "S105", "S106", "S314"]
