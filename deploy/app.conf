# Consumed by `eventkit azure` (phase 2). Declarative: adding an app is this file,
# not a new script.
name        = "ticket-reconciler"
image       = "ticket-reconciler"
health_path = "/healthz"
needs_db    = true
db_default  = "sqlite"

[[setting]]
name = "DATABASE_URL"
type = "computed"
required = true
[[setting]]
name = "DRUPAL_WEBHOOK_TOKEN"
type = "secret"
required = true
generate = "hex32"
[[setting]]
name = "AUTHORIZED_PRINCIPALS"
type = "list"
required = true
prompt = "Comma-separated admin emails. Empty means DENY ALL."
[[setting]]
name = "ENABLE_RESTORE"
type = "bool"
default = "False"
[[setting]]
name = "WEBSITES_PORT"
type = "fixed"
value = "8000"
[[setting]]
name = "WEBSITES_CONTAINER_START_TIME_LIMIT"
type = "fixed"
value = "600"
